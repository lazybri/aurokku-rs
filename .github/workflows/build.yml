name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本号（如 v0.1.0；省略 v 会自动补全）"
        required: true
        type: string
      prerelease:
        description: "标记为预发布"
        required: false
        type: boolean
        default: false
      draft:
        description: "保存为草稿"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Format, lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --all-targets

  # 一次运行内并行构建所有平台；发布 job 汇总产物后直接创建 Release。
  build:
    name: Build ${{ matrix.name }}
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            asset: dist/auroku-windows-x86_64.zip
          - name: linux-x86_64
            # 22.04 keeps the dynamically linked GUI compatible with glibc 2.35+.
            os: ubuntu-22.04
            rust_targets: x86_64-unknown-linux-musl
            asset: auroku-linux-x86_64.tar.gz
          - name: macos-universal
            os: macos-14
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            asset: auroku-macos-universal.zip
    steps:
      - uses: actions/checkout@v4

      - name: Install musl toolchain and Linux UAPI headers
        if: matrix.name == 'linux-x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools linux-libc-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2

      - name: Build & package (Windows, static CRT)
        if: matrix.name == 'windows-x86_64'
        shell: pwsh
        run: ./build-windows.ps1 -Target ${{ matrix.rust_targets }}

      - name: Build (Linux musl, fully static)
        if: matrix.name == 'linux-x86_64'
        run: |
          chmod +x build-linux.sh
          ./build-linux.sh

      - name: Build & package (macOS universal)
        if: matrix.name == 'macos-universal'
        run: |
          bash build-macos.sh
          mkdir -p dist/macos-universal
          cp dist/auroku dist/auroku-gui dist/macos-universal/
          ditto -c -k --keepParent dist/macos-universal auroku-macos-universal.zip

      - name: Verify & package (Linux musl)
        if: matrix.name == 'linux-x86_64'
        run: |
          file target/x86_64-unknown-linux-musl/release/auroku
          file target/x86_64-unknown-linux-musl/release/auroku \
            | grep -Eq 'statically linked|static-pie linked'
          # 必须没有动态解释器，否则 target 上缺少 loader 时无法运行。
          ! readelf -l target/x86_64-unknown-linux-musl/release/auroku | grep -q 'INTERP'
          # 必须没有 DT_NEEDED 动态依赖。
          ! readelf -d target/x86_64-unknown-linux-musl/release/auroku | grep -q 'NEEDED'
          # 双重确认没有动态依赖
          ! ldd target/x86_64-unknown-linux-musl/release/auroku 2>&1 | grep -q '=>'
          file dist/auroku-gui-linux-x86_64
          tar -czf auroku-linux-x86_64.tar.gz \
            -C dist auroku-linux-x86_64 auroku-gui-linux-x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Resolve release tag
        id: tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="$INPUT_VERSION"
            case "$tag" in
              v*) ;;
              *) tag="v$tag" ;;
            esac
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          files: artifacts/*
          generate_release_notes: true
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}


