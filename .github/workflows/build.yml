name: Build binaries

on:
  workflow_dispatch:
    inputs:
      target:
        description: "编译目标"
        required: true
        type: choice
        default: windows-x86_64
        options:
          - windows-x86_64
          - linux-x86_64
          - macos-universal

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-x86_64:
    name: Windows x86_64
    if: inputs.target == 'windows-x86_64'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kddilck-windows-x86_64
          path: target/x86_64-pc-windows-msvc/release/kddilck.exe
          if-no-files-found: error

  linux-x86_64:
    name: Linux x86_64 (static musl)
    if: inputs.target == 'linux-x86_64'
    runs-on: ubuntu-latest
    env:
      # libusb1-sys 会通过 pkg-config 探测 libudev；禁用探测以使用内置
      # netlink 后端，避免把 glibc 的 libudev 链进 musl 静态二进制。
      PKG_CONFIG: /bin/false
      CC_x86_64_unknown_linux_musl: musl-gcc
      AR_x86_64_unknown_linux_musl: ar
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
    steps:
      - uses: actions/checkout@v4

      - name: Install musl toolchain and Linux UAPI headers
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools linux-libc-dev

          # musl-gcc 的 specs 使用 -nostdinc，只会搜索 musl 自己的 include
          # 目录，导致 libusb 的 linux_netlink.c 找不到 <linux/magic.h>。
          # 这里只把内核 UAPI 头文件链接进 musl 的 include 路径；
          # 不要直接加 -I/usr/include，否则会把 glibc 头文件混入 musl 编译。
          MUSL_INC=/usr/include/x86_64-linux-musl
          sudo ln -sfn /usr/include/linux "$MUSL_INC/linux"
          sudo ln -sfn /usr/include/asm-generic "$MUSL_INC/asm-generic"
          sudo ln -sfn /usr/include/x86_64-linux-gnu/asm "$MUSL_INC/asm"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Build
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Verify static ELF
        run: |
          file target/x86_64-unknown-linux-musl/release/kddilck
          # rustc 对 musl target 默认产出 static-pie，file 会输出
          # "static-pie linked" 而不是 "statically linked"，两者都算静态可执行文件。
          file target/x86_64-unknown-linux-musl/release/kddilck \
            | grep -Eq 'statically linked|static-pie linked'
          # 双重确认没有动态解释器（ldd 会报 "not a dynamic executable"）
          ! ldd target/x86_64-unknown-linux-musl/release/kddilck 2>&1 | grep -q '=>'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kddilck-linux-x86_64
          path: target/x86_64-unknown-linux-musl/release/kddilck
          if-no-files-found: error

  macos-universal:
    name: macOS universal (arm64 + x86_64)
    if: inputs.target == 'macos-universal'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build universal binary
        run: bash build-macos.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kddilck-macos-universal
          path: dist/kddilck
          if-no-files-found: error
