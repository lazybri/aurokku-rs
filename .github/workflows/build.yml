name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本号（如 v0.1.0；省略 v 会自动补全）"
        required: true
        type: string
      prerelease:
        description: "标记为预发布"
        required: false
        type: boolean
        default: false
      draft:
        description: "保存为草稿"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Format, lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --workspace --all-targets

  # 一次运行内并行构建所有平台；发布 job 汇总产物后直接创建 Release。
  build:
    name: Build ${{ matrix.name }}
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            qt_arch: win64_msvc2022_64
            asset: dist/auroku-windows-x86_64.zip
          - name: linux-x86_64
            # 22.04 keeps the dynamically linked GUI compatible with glibc 2.35+.
            os: ubuntu-22.04
            rust_targets: x86_64-unknown-linux-musl
            qt_arch: linux_gcc_64
            asset: auroku-linux-x86_64.tar.gz
          - name: macos-universal
            os: macos-14
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            qt_arch: clang_64
            asset: auroku-macos-universal.zip
    steps:
      - uses: actions/checkout@v4

      - name: Install musl toolchain, Linux UAPI headers and Qt GUI deps
        if: matrix.name == 'linux-x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools linux-libc-dev cmake ninja-build \
            libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb-cursor0 libxcb-cursor-dev libxcb-icccm4-dev libxcb-image0-dev \
            libxcb-keysyms1-dev libxcb-randr0-dev libxcb-render-util0-dev \
            libxcb-shape0-dev libxcb-sync-dev libxcb-xfixes0-dev \
            libxcb-xinerama0-dev libxcb-xkb-dev

      - name: Set up MSVC developer environment
        if: matrix.name == 'windows-x86_64'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: ${{ matrix.qt_arch }}
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2

      - name: Build & package (Windows, static CRT + Qt GUI)
        if: matrix.name == 'windows-x86_64'
        shell: pwsh
        run: ./build-windows.ps1 -Target ${{ matrix.rust_targets }}

      - name: GUI smoke test (Windows, offscreen)
        if: matrix.name == 'windows-x86_64'
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $process = Start-Process -FilePath "dist\auroku-gui-windows-x86_64\auroku-gui.exe" `
            -ArgumentList "--smoke-test" -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            throw "GUI smoke test failed with exit code $($process.ExitCode)"
          }

      - name: Build (Linux musl, fully static CLI + Qt GUI)
        if: matrix.name == 'linux-x86_64'
        run: |
          chmod +x build-linux.sh
          ./build-linux.sh

      - name: Build & package (macOS universal CLI + native Qt GUI)
        if: matrix.name == 'macos-universal'
        run: |
          bash build-macos.sh
          QT_QPA_PLATFORM=offscreen ./dist/auroku-gui.app/Contents/MacOS/auroku-gui --smoke-test
          mkdir -p dist/macos-universal
          cp dist/auroku dist/macos-universal/
          cp -R dist/auroku-gui.app dist/macos-universal/
          ditto -c -k --keepParent dist/macos-universal auroku-macos-universal.zip

      - name: Verify & package (Linux musl)
        if: matrix.name == 'linux-x86_64'
        run: |
          file target/x86_64-unknown-linux-musl/release/auroku
          file target/x86_64-unknown-linux-musl/release/auroku \
            | grep -Eq 'statically linked|static-pie linked'
          # 必须没有动态解释器，否则 target 上缺少 loader 时无法运行。
          ! readelf -l target/x86_64-unknown-linux-musl/release/auroku | grep -q 'INTERP'
          # 必须没有 DT_NEEDED 动态依赖。
          ! readelf -d target/x86_64-unknown-linux-musl/release/auroku | grep -q 'NEEDED'
          # 双重确认没有动态依赖
          ! ldd target/x86_64-unknown-linux-musl/release/auroku 2>&1 | grep -q '=>'
          file dist/auroku-gui-linux-x86_64
          # Rust 后端必须已静态链接进 GUI，不能再依赖 libauroku_ffi.so。
          ! readelf -d dist/auroku-gui-linux-x86_64 | grep -q 'libauroku_ffi'
          QT_QPA_PLATFORM=offscreen \
            QT_PLUGIN_PATH="$QT_ROOT_DIR/plugins" \
            LD_LIBRARY_PATH="$QT_ROOT_DIR/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
            ./dist/auroku-gui-linux-x86_64 --smoke-test
          tar -czf auroku-linux-x86_64.tar.gz \
            -C dist auroku-linux-x86_64 auroku-gui-linux-x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Resolve release tag
        id: tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="$INPUT_VERSION"
            case "$tag" in
              v*) ;;
              *) tag="v$tag" ;;
            esac
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          files: artifacts/*
          generate_release_notes: true
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}


