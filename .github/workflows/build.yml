name: firmware-ci

# rp2354 branch CI: host-side mock tests + Cortex-M33 cross build.
# (The desktop release pipeline lives on main/qt6 and is intentionally absent.)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    name: Host tests (mock firmware)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace --all-targets

  firmware-target:
    name: Cortex-M33 build (thumbv8m.main-none-eabihf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv8m.main-none-eabihf
      - name: protocol core
        run: cargo build -p auroku-core --target thumbv8m.main-none-eabihf --release
      - name: firmware logic
        run: cargo build -p auroku-firmware --target thumbv8m.main-none-eabihf --release
