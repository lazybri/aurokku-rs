name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本号（如 v0.1.0；省略 v 会自动补全）"
        required: true
        type: string
      prerelease:
        description: "标记为预发布"
        required: false
        type: boolean
        default: false
      draft:
        description: "保存为草稿"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Format, lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --all-targets

  # 一次运行内并行构建所有平台；发布 job 汇总产物后直接创建 Release。
  build:
    name: Build ${{ matrix.name }}
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            asset: auroku-windows-x86_64.zip
          - name: linux-x86_64
            os: ubuntu-latest
            rust_targets: x86_64-unknown-linux-musl
            asset: auroku-linux-x86_64.tar.gz
          - name: macos-universal
            os: macos-14
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            asset: auroku-macos-universal.zip
    steps:
      - uses: actions/checkout@v4

      - name: Install musl toolchain and Linux UAPI headers
        if: matrix.name == 'linux-x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools linux-libc-dev

          # musl-gcc 的 specs 使用 -nostdinc，只会搜索 musl 自己的 include
          # 目录，导致 libusb 的 linux_netlink.c 找不到 <linux/magic.h>。
          # 这里只把内核 UAPI 头文件链接进 musl 的 include 路径；
          # 不要直接加 -I/usr/include，否则会把 glibc 头文件混入 musl 编译。
          MUSL_INC=/usr/include/x86_64-linux-musl
          sudo ln -sfn /usr/include/linux "$MUSL_INC/linux"
          sudo ln -sfn /usr/include/asm-generic "$MUSL_INC/asm-generic"
          sudo ln -sfn /usr/include/x86_64-linux-gnu/asm "$MUSL_INC/asm"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2

      - name: Build (Windows)
        if: matrix.name == 'windows-x86_64'
        run: cargo build --release --locked --target ${{ matrix.rust_targets }}

      - name: Build (Linux musl)
        if: matrix.name == 'linux-x86_64'
        env:
          # libusb1-sys 会通过 pkg-config 探测 libudev；禁用探测以使用内置
          # netlink 后端，避免把 glibc 的 libudev 链进 musl 静态二进制。
          PKG_CONFIG: /bin/false
          CC_x86_64_unknown_linux_musl: musl-gcc
          AR_x86_64_unknown_linux_musl: ar
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --release --locked --target ${{ matrix.rust_targets }}

      - name: Build & package (macOS universal)
        if: matrix.name == 'macos-universal'
        run: |
          bash build-macos.sh
          ditto -c -k --keepParent dist/auroku auroku-macos-universal.zip

      - name: Verify & package (Linux musl)
        if: matrix.name == 'linux-x86_64'
        run: |
          file target/x86_64-unknown-linux-musl/release/auroku
          # rustc 对 musl target 默认产出 static-pie，file 会输出
          # "static-pie linked" 而不是 "statically linked"，两者都算静态可执行文件。
          file target/x86_64-unknown-linux-musl/release/auroku \
            | grep -Eq 'statically linked|static-pie linked'
          # 双重确认没有动态解释器（ldd 会报 "not a dynamic executable"）
          ! ldd target/x86_64-unknown-linux-musl/release/auroku 2>&1 | grep -q '=>'
          tar -czf auroku-linux-x86_64.tar.gz \
            -C target/x86_64-unknown-linux-musl/release auroku

      - name: Package (Windows)
        if: matrix.name == 'windows-x86_64'
        shell: pwsh
        run: >
          Compress-Archive
          -Path target/x86_64-pc-windows-msvc/release/auroku.exe
          -DestinationPath auroku-windows-x86_64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Resolve release tag
        id: tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="$INPUT_VERSION"
            case "$tag" in
              v*) ;;
              *) tag="v$tag" ;;
            esac
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          files: artifacts/*
          generate_release_notes: true
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}


