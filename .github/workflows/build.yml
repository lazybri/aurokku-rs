name: Release

on:
  # Every commit builds debug binaries for all three platforms and only uploads
  # them as workflow artifacts (never to the Releases page).
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
  # Releases are published manually only, through this dispatch.
  workflow_dispatch:
    inputs:
      mode:
        description: "构建类型：release 发布会传到 Releases；debug 只上传 Actions 构件"
        type: choice
        options:
          - release
          - debug
        default: release
      version:
        description: "发布版本号（仅 release，如 v0.3.1；省略 v 会自动补全）"
        required: false
        type: string
      prerelease:
        description: "标记为预发布"
        required: false
        type: boolean
        default: false
      draft:
        description: "保存为草稿"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Format, lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --all-targets

  # 一次运行内并行构建所有平台；发布 job 汇总产物后直接创建 Release。
  build:
    name: Build ${{ matrix.name }}
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ${{ matrix.os }}
    env:
      # Commit pushes (and manual dispatch with mode=debug) build the dev profile.
      AUROKU_BUILD_DEBUG: ${{ (github.event_name == 'push' || github.event.inputs.mode == 'debug') && '1' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            glob: dist/*.zip
          - name: linux-x86_64
            # 22.04 keeps the dynamically linked GUI compatible with glibc 2.35+.
            os: ubuntu-22.04
            rust_targets: x86_64-unknown-linux-musl
            glob: dist/*.tar.gz
          - name: macos-universal
            os: macos-14
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            glob: dist/*.zip
    steps:
      - uses: actions/checkout@v4

      - name: Install musl toolchain and Linux UAPI headers
        if: matrix.name == 'linux-x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools linux-libc-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2

      - uses: microsoft/setup-msbuild@v2
        if: matrix.name == 'windows-x86_64'

      # libwdi is built as a static library here so the release binaries can
      # install the WinUSB driver in-process (no wdi-simple.exe to ship).
      # The WDK redist MSI is only extracted (/a), not installed, so no admin
      # rights are needed on the runner.
      - name: Build static libwdi (WinUSB payload only)
        if: matrix.name == 'windows-x86_64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          curl.exe -sSL "https://go.microsoft.com/fwlink/p/?LinkID=253170" -o wdk-redist.msi
          Start-Process msiexec.exe -Wait -ArgumentList '/a','wdk-redist.msi','/qn',"TARGETDIR=$PWD\wdk"
          git clone --depth 1 --branch v1.5.1 https://github.com/pbatard/libwdi.git

          # Build an x64-only library: dropping OPT_M32/OPT_ARM keeps the embedded
          # payload to the amd64 WinUSB files, so only installer_x64 has to exist.
          $config = 'libwdi\msvc\config.h'
          $text = Get-Content $config -Raw
          $text = $text -replace '#define OPT_M32', '/* #define OPT_M32 */'
          $text = $text -replace '#define OPT_ARM', '/* #define OPT_ARM */'
          # The default config.h points at developer machine paths for the
          # libusb-win32/libusbK payloads; we only embed the WinUSB one.
          $text = $text -replace '(?m)^#define LIBUSB0_DIR.*$', '/* #define LIBUSB0_DIR (not embedded) */'
          $text = $text -replace '(?m)^#define LIBUSBK_DIR.*$', '/* #define LIBUSBK_DIR (not embedded) */'
          Set-Content -Path $config -Value $text -NoNewline

          $slnDir = "$PWD\libwdi\"
          # Forward slashes: MSVC would treat \a, \w and \W in the macro as
          # escape sequences and corrupt the path.
          $wdkDir = (Join-Path $PWD 'wdk\Windows Kits\8.0') -replace '\\', '/'
          $macros = 'WDK_DIR="' + $wdkDir + '"'
          $common = @('/m', '/p:Configuration=Release', "/p:SolutionDir=$slnDir", "/p:BuildMacros=$macros")

          # detect_64build generates libwdi\build64.h which embedder includes.
          msbuild "libwdi\libwdi\.msvc\detect_64build.vcxproj" @common /p:Platform=x64
          msbuild "libwdi\libwdi\.msvc\installer_x64.vcxproj" @common /p:Platform=x64
          msbuild "libwdi\libwdi\.msvc\embedder.vcxproj" @common /p:Platform=Win32
          # Project references would be resolved as Release|x64 and fail MSB8013
          # (embedder/installer_x86 are Win32-only); we built them above, so drop
          # the references from the static library project.
          $staticProj = 'libwdi\libwdi\.msvc\libwdi_static.vcxproj'
          $projText = Get-Content $staticProj -Raw
          $projText = $projText -replace '(?s)\s*<ProjectReference Include="[^"]+">.*?</ProjectReference>', ''
          Set-Content -Path $staticProj -Value $projText -NoNewline

          msbuild $staticProj @common /p:Platform=x64
          if (-not (Test-Path "libwdi\x64\Release\lib\libwdi.lib")) { throw 'libwdi.lib was not produced' }
          "LIBWDI_LIB_DIR=$PWD\libwdi\x64\Release\lib" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build & package (Windows, static CRT + static libwdi)
        if: matrix.name == 'windows-x86_64'
        shell: pwsh
        run: ./.github/scripts/build-windows.ps1 -Target ${{ matrix.rust_targets }}

      - name: Build (Linux musl, fully static)
        if: matrix.name == 'linux-x86_64'
        run: |
          chmod +x .github/scripts/build-linux.sh
          ./.github/scripts/build-linux.sh

      - name: Build & package (macOS universal)
        if: matrix.name == 'macos-universal'
        run: |
          bash .github/scripts/build-macos.sh
          mkdir -p dist/macos-universal
          cp dist/auroku dist/auroku-gui dist/macos-universal/
          SUFFIX=""
          if [ "$AUROKU_BUILD_DEBUG" = "1" ]; then SUFFIX="-debug"; fi
          VERSION="v$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          ditto -c -k --keepParent dist/macos-universal \
            "dist/auroku-macos-universal-${VERSION}${SUFFIX}.zip"

      - name: Verify & package (Linux musl)
        if: matrix.name == 'linux-x86_64'
        run: |
          file dist/auroku-linux-x86_64
          file dist/auroku-linux-x86_64 | grep -Eq 'statically linked|static-pie linked'
          # 必须没有动态解释器，否则 target 上缺少 loader 时无法运行。
          ! readelf -l dist/auroku-linux-x86_64 | grep -q 'INTERP'
          # 必须没有 DT_NEEDED 动态依赖。
          ! readelf -d dist/auroku-linux-x86_64 | grep -q 'NEEDED'
          # 双重确认没有动态依赖
          ! ldd dist/auroku-linux-x86_64 2>&1 | grep -q '=>'
          file dist/auroku-gui-linux-x86_64
          SUFFIX=""
          if [ "$AUROKU_BUILD_DEBUG" = "1" ]; then SUFFIX="-debug"; fi
          VERSION="v$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          tar -czf "dist/auroku-linux-x86_64-${VERSION}${SUFFIX}.tar.gz" \
            -C dist auroku-linux-x86_64 auroku-gui-linux-x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}${{ (github.event_name == 'push' || github.event.inputs.mode == 'debug') && '-debug' || '' }}
          path: ${{ matrix.glob }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Resolve release tag
        id: tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          tag="$INPUT_VERSION"
          if [ -z "$tag" ]; then
            echo "::error::release 模式必须填写 version（例如 v0.3.1）"
            exit 1
          fi
          case "$tag" in
            v*) ;;
            *) tag="v$tag" ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          files: artifacts/*
          generate_release_notes: true
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}


