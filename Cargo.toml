[package]
name = "auroku"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "SERI / Type2Auth USB device service tool (Rust port of auRokku.py)"
license = "MIT"

[[bin]]
name = "auroku"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
md-5 = "0.10"
rusb = { version = "0.9", features = ["vendored"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
lto = true
strip = true
