[package]
name = "auroku"
version = "0.3.1"
edition = "2021"
rust-version = "1.88"
description = "SERI / Type2Auth USB device service tool (Rust port of auRokku.py)"
license = "MIT"

[features]
default = []
# Build the egui/eframe Material 3 front-end:
#   cargo run --release --features gui --bin auroku-gui
gui = ["dep:eframe"]
# Link the static libwdi built by CI (Windows only, see docs/windows-driver.md):
#   cargo build --release --features gui,static-libwdi
static-libwdi = ["dep:auroku-driver-sys"]

[[bin]]
name = "auroku"
path = "src/main.rs"

[[bin]]
name = "auroku-gui"
path = "src/bin/auroku-gui/main.rs"
required-features = ["gui"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
eframe = { version = "0.33", optional = true }
hex = "0.4"
md-5 = "0.10"
rusb = { version = "0.9", features = ["vendored"] }
serde_json = { version = "1", features = ["preserve_order"] }

[target.'cfg(windows)'.dependencies]
# Hand written libwdi bindings, only pulled in by the static-libwdi feature.
auroku-driver-sys = { path = "crates/auroku-driver-sys", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Safe effective-UID check to prevent the Linux GUI from running as root.
rustix = { version = "1", features = ["process"] }

[workspace]
members = ["crates/auroku-driver-sys"]

[profile.release]
lto = true
strip = true
